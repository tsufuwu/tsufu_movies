        @keyframes spin {
            0% { transform: rotate(0deg); }

            display: flex;

    <div id="player" data-obf="eyJzVWIiOiJleUpvSWpvaU9XRTJNV0k1T1dSaU5tWTBZVE5sWmpCak5EVmtNalF4TVdReFptSXlaV1FpTENKMElqb2laV0kwWVRrME1UZGhOV0kwWVdJME16Tm1ZbUpqT1RVMlpEa3hPRFU1WXprMll6ZzROREU0TVdSa1pUTXlOMlUzTVRka1l6VmlZakF5TUdSa01UVm1NeUo5IiwiaEQiOiI5YTYxYjk5ZGI2ZjRhM2VmMGM0NWQyNDExZDFmYjJlZCJ9">
        <div class="player-loader">
            <div class="player-spinner"></div>
        </div>
    </div>

    <script>
        window.popupReady    = false;
        window.popupFailed   = false;
        window.playerStarted = false;
        window.playerBlocked = false;
        window.streamURL     = '';

        // Truyền trạng thái cookie xuống JS
        window.hasShownAds = true;

        function blockPlayer() {
            if (window.playerBlocked) return;
            window.playerBlocked = true;
            window.streamURL = '';
            const playerEl = document.getElementById('player');
            if (!playerEl) return;
            playerEl.innerHTML = `
                <div class="adblock-screen">
                    <h2 class="adblock-title">PHÁT HIỆN CHẶN QUẢNG CÁO</h2>
                    <p class="adblock-desc">Vui lòng tắt chặn quảng cáo rồi tải lại trang để tiếp tục.</p>
                    <button class="adblock-btn" onclick="location.reload()">Tải lại trang</button>
                </div>
            `;
        }

        function prepareStream() {
            if (window.playerBlocked || window.popupReady !== true) return false;
            const playerEl = document.getElementById('player');
            if (!playerEl || !playerEl.dataset.obf) return false;
            try {
                const streamData = JSON.parse(atob(playerEl.dataset.obf));
                const ua = navigator.userAgent;
                const isIOS   = /iphone|ipod|ipad/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                const isMac   = /macintosh/i.test(ua) && !/windows|android/i.test(ua);
                const isApple = isIOS || isMac;
                window.streamURL  = '/' + streamData.sUb + (isApple ? '' : '?d=1');
                window.videoHash  = streamData.hD;
                return true;
            } catch (e) {
                console.error('Stream data parse error');
                return false;
            }
        }

        function startPlayer() {
            if (window.playerStarted || window.playerBlocked || window.popupReady !== true) return;
            if (!prepareStream()) { blockPlayer(); return; }
            window.playerStarted = true;
            const script = document.createElement('script');
            script.src   = 'player.js?ver=2.1';
            script.async = false;
            script.onload  = function () { console.log('[Player] loaded'); };
            script.onerror = function () { window.playerStarted = false; blockPlayer(); };
            document.body.appendChild(script);
        }

        window.addEventListener('popup-ready',  function () { startPlayer(); }, { once: true });
        window.addEventListener('popup-failed', function () { blockPlayer(); }, { once: true });
    </script>

    <!-- DevTools Guard -->

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof devtoolsDetector === "undefined") {
            location.reload();
            return;
        }
        devtoolsDetector.launch();
        devtoolsDetector.addListener(isOpen => { if (isOpen) location.reload(); });

        window.oncontextmenu = () => false;
        document.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();
            if (e.ctrlKey && (key === 'u' || (e.shiftKey && ['i', 'c', 'j'].includes(key))) ||
                e.key === 'F12' || (e.key === 'I' && e.ctrlKey && e.shiftKey)) {
                e.preventDefault();
            }
        });
    });
    </script>

    <!-- Ads / Popup -->
    <script src="https://streamc.xyz/ads.js?v=496784" onerror="if(!window.playerBlocked){blockPlayer();}"></script>

    <script>
        setTimeout(function () {
            if (window.popupReady === true && !window.playerStarted && !window.playerBlocked) {
                startPlayer(); return;
            }
            if (window.popupFailed === true && !window.playerBlocked) {
                blockPlayer();
            }
        }, 100);

        setTimeout(function () {
            if (!window.popupReady && !window.playerStarted && !window.playerBlocked) {
                blockPlayer();
            }
        }, 6000);
    </script>
