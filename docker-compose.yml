
services:
  backend:
    image: ghcr.io/tsufuwu/tsufu_movies-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: appphim_backend
    restart: always
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=production
    networks:
      - app-net
    # Uncomment and modify if you need specific volumes (e.g. for uploads or SQLite)
    # volumes:
    #   - ./data:/app/data

  frontend:
    image: ghcr.io/tsufuwu/tsufu_movies-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: appphim_frontend
    restart: always
    ports:
      - "${APP_PORT:-80}:${APP_PORT:-80}"
    environment:
      - APP_PORT=${APP_PORT:-80}
      - BACKEND_URL=http://backend:8000
      - NGINX_ENVSUBST_FILTER=APP_PORT|BACKEND_URL
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
