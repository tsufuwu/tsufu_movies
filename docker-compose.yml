services:
  backend:
    image: ghcr.io/tsufuwu/tsufu_movies-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: appphim_backend
    restart: always
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    networks:
      - app-net
    depends_on:
      - redis

  frontend:
    image: ghcr.io/tsufuwu/tsufu_movies-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: appphim_frontend
    restart: always
    ports:
      - "${APP_PORT:-80}:${APP_PORT:-80}"
    environment:
      - APP_PORT=${APP_PORT:-80}
      - BACKEND_URL=http://backend:8000
      - NGINX_ENVSUBST_FILTER=APP_PORT|BACKEND_URL
    volumes:
      - nginx-cache:/var/cache/nginx
    depends_on:
      - backend
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    container_name: appphim_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - app-net

volumes:
  redis-data:
  nginx-cache:

networks:
  app-net:
    driver: bridge
